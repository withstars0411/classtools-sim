<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수업 도구 체험실</title>
<meta name="description" content="크롬북 수업 도구를 교사·학생 화면으로 직접 눌러 보며 익히는 체험용 모의 도구 (비공식 · 가상 데이터)">
<meta property="og:type" content="website">
<meta property="og:title" content="수업 도구 체험실">
<meta property="og:description" content="크롬북 수업 도구를 교사·학생 화면으로 직접 눌러 보며 익히는 체험용 모의 도구 (비공식 · 가상 데이터)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
:root{
  --bg:#F2F4EF; --bg-2:#E5EAE3; --surface:#FFFFFF; --ink:#16221C; --ink-2:#4B5B52; --line:#D6DDD6;
  --accent:#2D684C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2; --chalk:#F1C646; --chalk-ink:#3A2E00;
  --bezel:#23282C; --bezel-edge:#23282C;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --os-font:"Noto Sans KR","Roboto","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --bg-2:#18211C; --surface:#161E19; --ink:#E4ECE6; --ink-2:#9DAEA4; --line:#2A352F;
    --accent:#74C59B; --accent-ink:#08140D; --accent-soft:#1E3328; --chalk:#E7BE45; --chalk-ink:#2A2100;
    --bezel:#070909; --bezel-edge:#3A4248; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --bg-2:#18211C; --surface:#161E19; --ink:#E4ECE6; --ink-2:#9DAEA4; --line:#2A352F;
  --accent:#74C59B; --accent-ink:#08140D; --accent-soft:#1E3328; --chalk:#E7BE45; --chalk-ink:#2A2100;
  --bezel:#070909; --bezel-edge:#3A4248; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #1A73E8; outline-offset:2px}
#root{min-height:100%; display:flex; flex-direction:column}
.boot{padding:48px 16px; text-align:center; color:var(--ink-2)}

/* ---------- landing ---------- */
.lp{width:100%; max-width:1120px; margin:0 auto; padding:40px 16px 56px; display:flex; flex-direction:column; gap:36px}
.lp-eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:.06em; color:var(--accent)}
.lp-eyebrow i{width:18px; height:3px; border-radius:2px; background:var(--chalk)}
.lp h1{font-family:var(--display); font-weight:400; font-size:clamp(44px,7vw,76px); line-height:1.02; margin:10px 0 14px; letter-spacing:-.01em; text-wrap:balance}
.lp h1 em{font-style:normal; background:linear-gradient(transparent 62%, var(--chalk) 62%, var(--chalk) 92%, transparent 92%); padding:0 .06em}
.lp-lead{font-size:17px; color:var(--ink-2); max-width:44ch; margin:0}
.entries{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.entry{position:relative; display:flex; flex-direction:column; gap:12px; text-align:left; padding:16px; border-radius:18px; border:1px solid var(--line); background:var(--surface); transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease}
.entry:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 10px 28px -18px rgba(20,40,30,.45)}
.entry .ill{aspect-ratio:16/10; width:100%; border-radius:12px; background:var(--bg-2); display:grid; place-items:center; overflow:hidden}
.entry .ill svg{width:88%; height:auto}
.entry h2{font-family:var(--display); font-weight:400; font-size:30px; line-height:1.1; margin:4px 0 0}
.entry p{margin:0; color:var(--ink-2); font-size:14.5px}
.entry .go{margin-top:auto; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--accent)}
.entry .tag{position:absolute; top:26px; right:26px; background:var(--chalk); color:var(--chalk-ink); font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px}
.feat h3{font-family:var(--display); font-weight:400; font-size:26px; margin:0 0 12px}
.feat-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.feat table{width:100%; border-collapse:collapse; min-width:640px; font-size:14px}
.feat th,.feat td{padding:11px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
.feat tr:last-child td{border-bottom:0}
.feat thead th{font-size:12.5px; letter-spacing:.04em; color:var(--ink-2); font-weight:600; background:var(--bg-2)}
.feat tbody th{font-weight:600; white-space:nowrap}
.lp-note{font-size:13px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:16px; margin:0; max-width:80ch}

/* ---------- sim shell ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:100; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:8px; background:none; border:0; padding:4px 0; font-family:var(--display); font-size:21px}
.brand svg{width:22px; height:22px; color:var(--accent)}
.seg{display:flex; background:var(--bg-2); border-radius:12px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 14px; border-radius:9px; font-size:14px; font-weight:500; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.seg button svg{width:16px; height:16px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar-r{margin-left:auto; display:flex; align-items:center; gap:10px}
.sim-tag{font-size:12px; color:var(--ink-2); border:1px dashed var(--line); padding:3px 8px; border-radius:8px}
.ghost{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 12px; font-size:14px; display:flex; align-items:center; gap:6px}
.ghost svg{width:16px; height:16px}
.ghost:hover{border-color:var(--accent)}
.stage{flex:1; min-height:0; display:flex; gap:16px; padding:12px 16px 16px}
.stage.teacher .devcol{max-width:1320px; margin:0 auto}
.devcol{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.devlabel{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
.devlabel b{font-family:var(--display); font-weight:400; font-size:19px; color:var(--ink)}
.devlabel .dot{width:8px; height:8px; border-radius:50%; background:var(--accent)}
.devlabel .dot.s{background:var(--chalk)}
.dev{flex:1; min-height:520px; display:flex; flex-direction:column; background:var(--bezel); border:1px solid var(--bezel-edge); border-radius:18px; padding:14px 10px 10px; position:relative}
.dev::before{content:""; position:absolute; top:5px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:#3b4247}

/* virtual teacher remote */
.remote{width:300px; flex:none; display:flex; flex-direction:column; gap:14px; padding:16px; border-radius:16px; border:1px solid var(--line); background:var(--surface); overflow:auto; align-self:stretch}
.r-head{display:flex; gap:10px; align-items:center}
.r-av{width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--display); font-size:20px; flex:none}
.r-head b{font-family:var(--display); font-weight:400; font-size:22px; display:block; line-height:1.1}
.r-head small{color:var(--ink-2); font-size:12.5px; line-height:1.4; display:block}
.r-group{display:flex; flex-direction:column; gap:7px}
.r-group > span{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--ink-2)}
.r-btns{display:flex; flex-wrap:wrap; gap:6px}
.rbtn{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:7px 11px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px}
.rbtn svg{width:15px; height:15px}
.rbtn:hover{border-color:var(--accent)}
.rbtn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.rbtn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; justify-content:center; padding:10px 12px}
.rbtn.warn{color:#B3261E}
.rbtn:disabled{opacity:.45; cursor:default}
.r-info{font-size:13px; background:var(--bg-2); border-radius:10px; padding:9px 11px; display:flex; flex-direction:column; gap:2px}
.r-info b{font-variant-numeric:tabular-nums; letter-spacing:.06em}
.r-check{display:flex; gap:8px; align-items:flex-start; font-size:13.5px}
.r-check input{margin-top:4px; accent-color:var(--accent)}

@media (max-width:1100px){
  .stage.split{flex-direction:column}
  .stage.split .dev{min-height:560px}
}
@media (max-width:900px){
  .entries{grid-template-columns:1fr}
  .stage.student{flex-direction:column}
  .remote{width:auto}
  .sim-tag{display:none}
}
@media (max-width:560px){
  .seg button{padding:6px 9px}
  .seg button svg{display:none}
  .dev{padding:12px 6px 6px; border-radius:14px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important; animation:none!important}
}

/* ---------- simulated ChromeOS (fixed light look, independent of page theme) ---------- */
.scr{
  --os-ink:#1F1F1F; --os-ink-2:#5E6368; --os-line:#DADCE0; --os-primary:#0B57D0;
  flex:1; min-height:0; position:relative; overflow:hidden; border-radius:6px; container-type:inline-size;
  font-family:var(--os-font); color:var(--os-ink); line-height:1.45; color-scheme:light;
  font-size:clamp(11.5px, 1.1cqi + 4px, 14px);
  background:#7FA7C9 radial-gradient(120% 90% at 15% 110%, #F5C98B 0%, rgba(245,201,139,0) 55%), linear-gradient(160deg,#5C8DBE 0%,#9DB9D6 55%,#E9D6C0 100%);
}
:where(.scr) button{color:inherit}
:where(.scr) svg{flex:none; width:1.15em; height:1.15em}
.desk{position:absolute; inset:0 0 44px 0}
.desk.full{inset:0}
.win{position:absolute; inset:10px 14px; display:flex; flex-direction:column; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 12px 32px -8px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06)}
.win.max{inset:0; border-radius:0; box-shadow:none}
.win-t{height:32px; flex:none; display:flex; align-items:center; gap:8px; padding:0 4px 0 10px; background:#D5E4F7; font-size:.86em; color:#1F1F1F}
.win-t.g{background:#E3EAD0}
.win-t .ttl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.win-t .wb{margin-left:auto; display:flex; flex:none}
.win-t .wb button{width:32px; height:26px; border:0; background:none; border-radius:6px; display:grid; place-items:center; color:#3C4A5C}
.win-t .wb button:hover{background:rgba(0,0,0,.07)}
.win-t .wb svg{width:14px; height:14px}
.appic{width:16px; height:16px; border-radius:50%; flex:none; background:#7B4FD6; display:grid; place-items:center; color:#fff}
.appic svg{width:10px; height:10px}
.win-b{flex:1; min-height:0; display:flex; flex-direction:column; position:relative}
.shelf{position:absolute; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center; padding:0 8px; background:rgba(28,30,34,.62); backdrop-filter:blur(14px); color:#fff; z-index:20}
.shelf .launch{width:32px; height:32px; border-radius:50%; border:0; background:none; display:grid; place-items:center}
.shelf .launch i{width:14px; height:14px; border-radius:50%; border:2px solid #fff}
.shelf .apps{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:4px}
.shelf .app{position:relative; width:36px; height:36px; border-radius:50%; border:0; display:grid; place-items:center; background:transparent}
.shelf .app:hover{background:rgba(255,255,255,.14)}
.shelf .app .ic{width:26px; height:26px; border-radius:50%; display:grid; place-items:center}
.shelf .app .ic svg{width:15px; height:15px}
.shelf .app.open::after{content:""; position:absolute; bottom:1px; left:50%; width:4px; height:3px; margin-left:-2px; border-radius:2px; background:rgba(255,255,255,.7)}
.shelf .app.act::after{width:12px; margin-left:-6px; background:#fff}
.tray{margin-left:auto; display:flex; align-items:center; gap:6px}
.tray .pill2{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border-radius:16px; padding:3px 10px; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.tray .pill2 svg{width:13px; height:13px}
@container (max-width:860px){ .tray .hide-s{display:none} .shelf .apps{position:static; transform:none; margin-left:6px} }

/* shared controls */
.ib{width:32px; height:32px; border:0; border-radius:50%; background:none; display:grid; place-items:center; color:#44474E; flex:none}
.ib:hover{background:rgba(0,0,0,.06)}
.ib:disabled{opacity:.35}
.ib svg{width:18px; height:18px}
.av{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-size:.76em; font-weight:700}
.sw{position:relative; width:40px; height:24px; flex:none; border-radius:12px; border:2px solid #74777F; background:#E0E2EC; padding:0}
.sw::after{content:""; position:absolute; top:4px; left:4px; width:12px; height:12px; border-radius:50%; background:#74777F; transition:all .15s}
.sw[aria-checked="true"]{background:#2E6A96; border-color:#2E6A96}
.sw[aria-checked="true"]::after{left:19px; top:2px; width:16px; height:16px; background:#fff}
.sw:disabled{opacity:.38}
.inp{height:40px; border:1px solid #74777F; border-radius:8px; padding:0 12px; font:inherit; color:#1F1F1F; background:#fff; width:100%}
.inp:focus{outline:2px solid #2E6A96; outline-offset:-1px; border-color:transparent}
.grow{flex:1}
.muted{color:var(--os-ink-2)}
.anchor{position:relative; display:inline-flex}
.pill{height:36px; border-radius:18px; padding:0 18px; border:0; display:inline-flex; align-items:center; justify-content:center; gap:4px; font-weight:500; font-size:.93em; white-space:nowrap}
.pill svg{width:18px; height:18px}
.pill.tonal{background:#CEE5FD; color:#0B2F4E}
.pill.tonal:hover{background:#BDDAF8}
.pill.fill{background:#2E6A96; color:#fff}
.pill.fill:hover{background:#275D84}
.pill:disabled{background:#E2E2E3; color:#8F9194; cursor:default}

/* teacher: class tools app */
.ta{flex:1; min-height:0; overflow:auto; background:linear-gradient(180deg,#D5E4F5 0%,#E7EFF8 34%,#EEF2F7 100%)}
.ta-col{width:min(560px,100%); margin:0 auto; padding:26px 16px 30px; display:flex; flex-direction:column; gap:10px}
.ta-title{display:flex; align-items:center; justify-content:center; gap:8px; font-size:1.4em; font-weight:400; color:#C0562B; margin:0}
.ta-title.idle{color:#4A7CB0}
.ta-title svg{width:1em; height:1em}
.ta-sub{text-align:center; color:#5E6368; font-size:.87em; margin:4px 0 8px; line-height:1.45}
.ta-two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ta-flat{width:100%; border:0; background:#FBFCFE; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; text-align:left}
.ta-flat > svg{width:22px; height:22px}
.ta-flat b{display:block; font-weight:400}
.ta-flat small{display:block; color:#5E6368; font-size:.84em}
.ta-flat:hover{background:#F2F6FB}
.ta-flat.on{background:#D3E3FD}
.ta-flat.off{opacity:.55}
.ta-view{background:#FBFCFE; border-radius:16px; padding:14px 14px 0}
.ta-view .lbl{text-align:center; font-size:.92em; font-weight:500; margin-bottom:9px}
.ta-view .desc{text-align:center; color:#5E6368; font-size:.85em; margin:9px 0 12px}
.seg3{display:flex; justify-content:center}
.seg3 > span{display:inline-flex; background:#EDF0F5; border-radius:18px; padding:2px}
.seg3 button{height:32px; min-width:74px; padding:0 18px; border:0; border-radius:16px; background:transparent; font-weight:500; font-size:.9em}
.seg3 button:hover{background:#E2E8F1}
.seg3 button[aria-pressed="true"]{background:#2E6A96; color:#fff}
.durbox{background:#EFF3F9; border-radius:12px 12px 0 0; padding:18px 16px 14px; text-align:center}
.durbox .row{display:flex; align-items:center; justify-content:center; gap:8px}
.durbox input{width:84px; height:52px; font:inherit; font-size:1.9em; text-align:center; border:1px solid #79747E; border-radius:8px; background:#fff; color:#1F1F1F}
.durbox .u{font-size:1.4em}
.durbox small{display:block; color:#5E6368; margin-top:10px; font-size:.86em}
.durbox small + small{margin-top:2px}
.viewbox{background:#EFF3F9; border-radius:0 0 12px 12px; padding:14px 16px 16px; margin-top:2px}
.viewbox .lbl{text-align:center; font-size:.9em; font-weight:500; margin-bottom:8px}
.viewbox .desc{text-align:center; color:#5E6368; font-size:.85em; margin-top:10px}
.info{display:flex; gap:12px; align-items:flex-start; background:#E7EFFA; border-radius:12px; padding:12px 14px; font-size:.86em; color:#1B3A57; line-height:1.5}
.info svg{width:18px; height:18px; flex:none; margin-top:1px}
.codewin{position:absolute; inset:0; z-index:42; display:flex; flex-direction:column; background:#EDF1F7}
.codebody{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; padding:20px; text-align:center}
.codebody p{margin:0; font-size:1.35em; font-weight:400}
.codetiles{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.codetiles i{width:62px; height:76px; border-radius:12px; background:#D3E3FD; display:grid; place-items:center; font-style:normal; font-size:2.4em; font-weight:500; color:#1B2B3A}
.codetiles .sp{width:20px; background:none}
.ta-code{align-self:center; display:flex; align-items:center; gap:2px; background:#F7F8FA; border-radius:999px; padding:3px 6px 3px 14px; margin:2px 0 10px; box-shadow:0 1px 2px rgba(20,40,70,.06); font-weight:500}
.ta-code > svg{width:18px; height:18px; margin-right:6px}
.ta-code .sep{width:1px; height:22px; background:#DADCE0; margin:0 4px}
.ta-code .ib{width:34px; height:34px}
.ta-card{background:#FBFCFE; border-radius:16px}
.ta-card > .ta-item:first-child{border-radius:16px 16px 0 0}
.ta-card > .ta-item:last-child{border-radius:0 0 16px 16px}
.ta-card > .ta-item:only-child{border-radius:16px}
.ta-item{width:100%; display:flex; align-items:center; gap:18px; padding:13px 18px; border:0; background:none; text-align:left}
.ta-item + .ta-item{border-top:2px solid #EEF2F7}
.ta-item:hover{background:#F2F6FB}
.ta-item > svg{width:22px; height:22px}
.ta-item .tx{flex:1; min-width:0}
.ta-item b{display:block; font-weight:500}
.ta-item small{display:block; color:#5E6368; font-size:.84em}
.ta-item .chev{width:18px; height:18px}
.ta-ctrl{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px}
.ta-big{border:0; border-radius:16px; background:#D5E4F5; color:#1F1F1F; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:12px 8px; font-weight:500; font-size:.92em; min-height:62px}
.ta-big svg{width:16px; height:16px}
.ta-big:hover{background:#C8DBF0}
.ta-big[aria-pressed="true"]{background:#2E6A96; color:#fff}
.ta-foot{display:flex; align-items:center; gap:12px; padding:10px 12px 12px 16px; border-top:2px solid #EEF2F7; flex-wrap:wrap}
.ta-foot .tx b{display:block; font-weight:500}
.ta-foot .tx small{display:block; color:#5E6368; font-size:.84em}
.ring{width:22px; height:22px; flex:none}
.ta-head{display:flex; align-items:center; gap:12px; margin:0 0 6px}
.ta-head h2{margin:0; font-size:1.2em; font-weight:400; flex:1}
.ta-back{width:40px; height:40px; border-radius:50%; border:0; background:#DCE6F2; display:grid; place-items:center}
.ta-back:hover{background:#CFDDEE}
.ta-back svg{width:20px; height:20px}
.ta-row{display:flex; align-items:center; gap:14px; padding:12px 10px 12px 16px; background:#FBFCFE; border-radius:14px; min-width:0}
.ta-rows{display:flex; flex-direction:column; gap:8px}
.ta-row .tx{flex:1; min-width:0}
.ta-row b{display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ta-row small{display:block; color:#5E6368; font-size:.84em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ta-row small.off{color:#9A5B00}
.ta-meta{display:flex; align-items:center; gap:8px; font-size:.86em; color:#44474E; padding:0 4px 4px}
.ta-empty{padding:26px 18px; text-align:center; color:#5E6368; display:flex; flex-direction:column; gap:8px; align-items:center; margin-top:10px}
.ta-empty b{color:#1F1F1F; font-weight:400; font-size:1.15em}
.ta-empty span{max-width:34ch; line-height:1.5; font-size:.9em}
.ta-empty svg.big{width:88px; height:88px; color:#A8C7E8; margin-bottom:2px}
.fav{width:26px; height:26px; border-radius:6px; flex:none; display:grid; place-items:center; color:#fff; font-weight:700; font-size:.78em}
.fav svg{width:16px; height:16px}
.stag{font-size:.72em; font-weight:700; color:#0842A0; background:#D3E3FD; border-radius:6px; padding:1px 6px; white-space:nowrap; margin-left:6px; vertical-align:1px}
.ta-tg{display:flex; align-items:center; gap:14px; padding:13px 18px}
.ta-tg + .ta-tg{border-top:2px solid #EEF2F7}
.ta-tg .tx{flex:1}
.ta-tg.off{opacity:.6}
.ta-card .ta-tg{background:#F6F8FB}
.ta-card .ta-tg + .ta-tg{border-top:2px solid #fff}
.ta-tg small{display:block; color:#5E6368; font-size:.84em}
.says{display:flex; flex-direction:column; gap:2px; padding:6px}
.says button{border:0; background:none; text-align:left; padding:9px 12px; border-radius:10px; display:flex; gap:10px; align-items:center}
.says button:hover{background:#EAF1FA}
.says button svg{width:16px; height:16px; color:#2E6A96}
.sayrow{display:flex; gap:8px; padding:6px 10px 12px}

/* menus, dialogs, viewer */
.menu{position:absolute; top:calc(100% + 4px); right:0; z-index:45; min-width:180px; background:#fff; border-radius:12px; padding:6px 0; box-shadow:0 10px 28px -6px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.04)}
.menu.up{top:auto; bottom:calc(100% + 4px)}
.menu.l{left:0; right:auto}
.menu > button{width:100%; border:0; background:none; text-align:left; padding:10px 16px; display:flex; align-items:center; gap:10px; white-space:nowrap}
.menu > button:hover{background:#EEF3FA}
.menu > button svg{width:18px; height:18px; color:#44474E}
.menu > button[aria-checked="true"]{font-weight:500; color:#2E6A96}
.dim{position:absolute; inset:0; z-index:40; background:rgba(40,48,60,.38); display:grid; place-items:center; padding:14px}
.dlg{width:min(420px,100%); max-height:100%; overflow:auto; background:#fff; border-radius:24px; padding:22px 22px 18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 18px 50px -12px rgba(0,0,0,.45)}
.dlg h3{margin:0; font-size:1.38em; font-weight:400}
.dlg .for{font-weight:500; margin-top:-4px}
.dlg .note{color:#5E6368; font-size:.88em; margin:-4px 0 0}
.sel{position:relative}
.sel select{appearance:none; -webkit-appearance:none; width:100%; height:46px; border:0; border-radius:8px; background:#EEF1F6; padding:0 40px 0 14px; font:inherit; color:#1F1F1F}
.sel svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; width:20px; height:20px}
.chk{display:flex; align-items:center; gap:14px; padding:4px 2px; cursor:pointer}
.chk input{width:18px; height:18px; margin:0 0 0 2px; accent-color:#216392; flex:none}
.chk .tx small{display:block; color:#5E6368; font-size:.84em}
.chk.dis{opacity:.5; cursor:default}
.lnk{color:#1A5C8F; text-decoration:underline; text-underline-offset:2px; background:none; border:0; padding:0; text-align:left; font:inherit}
.acts{display:flex; justify-content:flex-end; gap:8px; margin-top:6px; flex-wrap:wrap}
.picks{display:flex; flex-direction:column; max-height:260px; overflow:auto; margin:0 -6px}
.picks .chk{padding:7px 8px; border-radius:10px}
.picks .chk:hover{background:#F2F5F9}
.codebig{font-size:3em; font-weight:500; letter-spacing:.16em; text-align:center; padding:10px 0; font-variant-numeric:tabular-nums}
.vwin{position:absolute; inset:0; z-index:42; display:flex; flex-direction:column; background:#808080}
.vbody{flex:1; min-height:0; position:relative}
.vpill{position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:8px; background:rgba(38,38,40,.92); color:#fff; border-radius:10px; padding:6px 14px; font-size:.88em; white-space:nowrap; max-width:calc(100% - 24px); overflow:hidden; text-overflow:ellipsis}
.vpill svg{width:16px; height:16px}
.mbox{position:relative; overflow:hidden; background:#000; box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.minner{position:absolute; left:0; top:0; width:1024px; height:640px; transform-origin:0 0; pointer-events:none}
.minner .scr{position:absolute; inset:0; border-radius:0; font-size:14px}
.waitbox{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; color:#fff}
.waitbox .n{font-size:2.6em; font-weight:500; font-variant-numeric:tabular-nums}
.waitbox small{color:#E8EAED; opacity:.85}
.toasts{position:absolute; left:50%; bottom:56px; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; align-items:center; gap:6px; width:max-content; max-width:calc(100% - 24px); pointer-events:none}
.toasts.hi{bottom:14px}
.toast{pointer-events:auto; display:flex; align-items:center; gap:14px; background:#313235; color:#F2F2F2; border-radius:8px; padding:9px 14px; font-size:.9em; box-shadow:0 6px 18px -4px rgba(0,0,0,.4); animation:tin .18s ease-out}
.toast button{border:0; background:none; color:#A8C7FA; font-weight:500; padding:0}
@keyframes tin{from{transform:translateY(6px); opacity:0}}
@container (max-width:560px){
 .ta-col{padding:18px 10px 24px}
 .ta-item{gap:12px; padding:12px 14px}
 .ta-foot .tx small{display:none}
}

/* student: browser window */
.tabs{display:flex; align-items:flex-end; gap:2px; padding:6px 8px 0; background:#DFE5EE; overflow:hidden; flex:none}
.tab{max-width:190px; min-width:0; height:32px; border:0; border-radius:9px 9px 0 0; padding:0 10px; display:flex; align-items:center; gap:7px; background:transparent; font-size:.86em}
.tab span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tab svg{width:14px; height:14px}
.tab:hover{background:rgba(255,255,255,.5)}
.tab[aria-selected="true"]{background:#fff}
.omni{display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--os-line); flex:none}
.omni .url{flex:1; min-width:0; height:30px; border-radius:15px; background:#F0F4F9; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:.88em; color:var(--os-ink-2); white-space:nowrap; overflow:hidden}
.omni .url svg{width:14px; height:14px}
.omni .ib{width:28px; height:28px}
.page{flex:1; min-height:0; overflow:auto; padding:18px 22px 24px; background:#fff}
.page h1{font-size:1.5em; font-weight:700; margin:0 0 6px; line-height:1.25}
.page .lead{color:var(--os-ink-2); margin:0 0 14px}
.plinks{display:flex; flex-direction:column; gap:6px; margin-top:16px; align-items:flex-start}
.plinks button{border:0; background:none; padding:2px 0; color:#1A0DAB; text-decoration:underline; text-underline-offset:3px; display:flex; align-items:center; gap:6px; text-align:left}
.plinks button svg{width:14px; height:14px}
.plinks button small{color:var(--os-ink-2); text-decoration:none; font-size:.82em}
.planets{display:flex; align-items:center; gap:3%; padding:18px 10px; border-radius:14px; background:#0F1830; overflow:hidden}
.planet{border-radius:50%; flex:none; position:relative}
.planet.ring::after{content:""; position:absolute; left:-35%; right:-35%; top:42%; height:16%; border-radius:50%; border:2px solid #E8D39A; transform:rotate(-12deg)}
.sun{width:26px; height:52px; border-radius:0 52px 52px 0; background:#F7B733; margin-left:-10px; flex:none}
.ptable{border-collapse:collapse; width:100%; max-width:520px; font-size:.95em}
.ptable th,.ptable td{border:1px solid var(--os-line); padding:6px 10px; text-align:left}
.ptable th{background:#F0F4F9; font-weight:500}
.ptable td.n{text-align:right; font-variant-numeric:tabular-nums}
.sheetbar{display:flex; gap:6px; margin-bottom:10px}
.sheetbar i{height:10px; border-radius:3px; background:#CDE6D3}
.ws{border:1px solid var(--os-line); border-radius:12px; padding:14px; max-width:560px; display:flex; flex-direction:column; gap:10px}
.ws .opts{display:flex; flex-wrap:wrap; gap:6px}
.ws .opts button{border:1px solid var(--os-line); background:#fff; border-radius:8px; padding:4px 10px}
.ws .opts button[aria-pressed="true"]{background:#D3E3FD; border-color:#0B57D0; color:#041E49}
.ws textarea{font:inherit; border:1px solid #747775; border-radius:8px; padding:8px 10px; min-height:70px; resize:vertical; width:100%}
.quiz{display:flex; flex-direction:column; gap:14px; max-width:560px}
.quiz fieldset{border:1px solid var(--os-line); border-radius:12px; padding:10px 14px; margin:0}
.quiz legend{font-weight:500; padding:0 4px}
.quiz label{display:flex; gap:8px; align-items:center; padding:3px 0}
.quiz input{accent-color:#0B57D0}
.player{position:relative; aspect-ratio:16/9; max-width:560px; border-radius:12px; background:linear-gradient(135deg,#1B2140,#3B2A5A); display:grid; place-items:center; overflow:hidden}
.player .pb{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.9); display:grid; place-items:center; color:#222}
.player .pb svg{width:26px; height:26px}
.player .bar2{position:absolute; left:12px; right:12px; bottom:10px; height:4px; border-radius:2px; background:rgba(255,255,255,.3)}
.player .bar2 i{display:block; width:36%; height:100%; background:#FF4E45; border-radius:2px}
.thumbs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.thumb{display:flex; flex-direction:column; gap:4px; font-size:.85em}
.thumb i{aspect-ratio:16/9; border-radius:8px; display:grid; place-items:center; color:#fff}
.thumb i svg{width:20px; height:20px}
.blocks{display:grid; grid-template-columns:repeat(10,1fr); gap:3px; max-width:300px; padding:8px; background:#1d1d2b; border-radius:10px}
.blocks i{aspect-ratio:1; border-radius:3px}
.nt{display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:8%}
.nt .sb{width:min(460px,90%); height:44px; border-radius:22px; border:1px solid var(--os-line); display:flex; align-items:center; gap:10px; padding:0 16px; color:var(--os-ink-2); box-shadow:0 1px 6px rgba(32,33,36,.12)}
.nt .sb svg{width:18px; height:18px}
.nt .sc{display:flex; gap:18px; flex-wrap:wrap; justify-content:center}
.nt .sc span{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:.82em; width:72px}
.nt .sc i{width:44px; height:44px; border-radius:50%; background:#F0F4F9; display:grid; place-items:center; font-style:normal; font-weight:700; color:#0B57D0}

/* student: class tools app (green theme) */
.sa{flex:1; min-height:0; position:relative; overflow:hidden; background:#F0F3E2; color:#1B1D14; display:flex; flex-direction:column}
.sa-strip{flex:none; display:flex; align-items:center; gap:0; padding:4px 6px; background:#E4EBD2; overflow:hidden}
.sa-strip button{max-width:190px; min-width:0; height:30px; border:0; border-radius:8px; padding:0 12px; background:transparent; display:flex; align-items:center; gap:7px; font-size:.84em; color:#31341F}
.sa-strip button span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sa-strip button svg{width:15px; height:15px}
.sa-strip button:hover{background:rgba(255,255,255,.45)}
.sa-strip button[aria-selected="true"]{background:#F6F8EA}
.sa-strip .home{padding:0 10px; flex:none}
.sa-strip .sep{width:1px; height:16px; background:#C7CFB4; flex:none}
.sa-strip .end{margin-left:auto; padding:0 10px; flex:none; color:#4B5136}
.sa-body{flex:1; min-height:0; position:relative}
.sa-scroll{position:absolute; inset:0; overflow:auto}
.sa-tool{position:absolute; top:12px; left:14px; z-index:6; display:flex; align-items:center; gap:2px; background:#F6F8EA; border-radius:999px; padding:4px 6px; box-shadow:0 2px 8px rgba(40,50,20,.2)}
.sa-tool button{width:30px; height:30px; border-radius:50%; border:0; background:none; display:grid; place-items:center; color:#45483C}
.sa-tool button svg{width:17px; height:17px}
.sa-tool button:hover:not(:disabled){background:rgba(70,80,40,.08)}
.sa-tool button[aria-pressed="true"]{background:#B9D48B; color:#1A2A00}
.sa-tool button:disabled{color:#B8BBAA; cursor:default}
.sa-tool .sep{width:1px; height:18px; background:#D6D9C6; margin:0 5px}
.sa-col{width:min(620px, calc(100% - 28px)); margin:0 auto; padding:14px 0 70px; display:flex; flex-direction:column; gap:8px}
@container (max-width:900px){ .sa-col{padding-top:58px} }
.sa-hero{position:relative; overflow:hidden; border-radius:28px; min-height:150px; padding:24px 28px; background:linear-gradient(115deg,#F7FBE8 0%,#EAF4CC 55%,#D9EBAF 100%); display:flex; flex-direction:column; justify-content:center}
.sa-hero .deco{position:absolute; right:0; top:0; width:64%; height:100%}
.sa-hero h2{position:relative; z-index:1; margin:0 0 6px; font-size:1.6em; font-weight:400; max-width:64%; line-height:1.3}
.sa-hero p{position:relative; z-index:1; margin:0; font-size:.9em; max-width:70%; color:#2E3126}
.sa-hero .st{position:absolute; right:12px; bottom:10px; z-index:1; display:flex; align-items:center; gap:5px; background:#E8F3D0; border-radius:10px; padding:3px 9px; font-size:.78em}
.sa-hero .st svg{width:12px; height:12px}
.sa-2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sa-card{background:#FBFDEE; border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:12px; min-width:0; min-height:52px}
.sa-card > svg{width:18px; height:18px; color:#45483C}
.sa-card > span{flex:1; min-width:0; font-size:.9em}
.sw.g{border-color:#77786A; background:#E3E4D3}
.sw.g::after{background:#77786A}
.sw.g[aria-checked="true"]{background:#4B661F; border-color:#4B661F}
.sw.g[aria-checked="true"]::after{background:#fff}
.sa-tabs{background:#FBFDEE; border-radius:16px; padding:4px 8px 8px}
.sa-hd{display:flex; align-items:center; gap:10px; padding:10px 8px 12px; font-size:.9em}
.sa-hd > svg{width:18px; height:18px}
.sa-rst{margin-left:auto; border:0; background:none; display:flex; align-items:center; gap:6px; color:#55584A; font-size:.86em; padding:4px 8px; border-radius:8px}
.sa-rst:hover{background:rgba(70,80,40,.08)}
.sa-rst svg{width:15px; height:15px}
.sa-list{background:#EFF1E2; border-radius:12px; padding:6px}
.sa-li{width:100%; display:flex; align-items:center; gap:12px; padding:9px 10px; border:0; background:none; border-radius:10px; text-align:left; font-size:.9em}
.sa-li:hover{background:#E4E8D0}
.sa-li .fav{width:20px; height:20px; border-radius:5px; font-size:.68em}
.sa-li .fav svg{width:13px; height:13px}
.sa-li .tx{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sa-li > svg{width:17px; height:17px; color:#45483C}
.sa-empty{padding:18px; text-align:center; color:#5C5F50; font-size:.9em}
.sa-page{position:absolute; inset:52px 14px 14px; z-index:2; display:flex; flex-direction:column; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(40,50,20,.15)}
.sa-ph{flex:none; display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid #E4E6D6; background:#FBFDEE; font-size:.86em; min-width:0}
.sa-ph b{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%}
.sa-ph .u{flex:1; min-width:0; color:#6A6D5E; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sa-ph .ri{display:flex; align-items:center; gap:5px; color:#45483C; white-space:nowrap}
.sa-ph .ri svg{width:15px; height:15px}
.sa-ph .fav{width:20px; height:20px; border-radius:5px; font-size:.68em}
.sa-ph .fav svg{width:13px; height:13px}
.blocked{position:absolute; right:14px; bottom:14px; z-index:70; max-width:calc(100% - 28px); display:flex; gap:10px; align-items:flex-start; background:#E8EAE0; color:#31341F; border-radius:12px; padding:11px 16px; font-size:.86em; line-height:1.45; box-shadow:0 6px 18px -6px rgba(0,0,0,.28)}
.blocked svg{width:17px; height:17px; color:#6A6D5E; margin-top:1px}
.sa-watch{position:absolute; right:14px; bottom:58px; z-index:80; display:flex; align-items:center; gap:8px; background:#D2E7AE; color:#1A2A00; border-radius:999px; padding:8px 16px; font-size:.88em; box-shadow:0 2px 10px rgba(40,60,10,.2); animation:tin .2s ease-out; max-width:calc(100% - 28px)}
.sa-watch svg{width:17px; height:17px}
.sa-watch .n{width:22px; height:22px; border-radius:50%; background:#4B661F; color:#fff; display:grid; place-items:center; font-weight:700; font-size:.85em; flex:none}
.desk.full ~ .sa-watch{bottom:14px}
.sa-watch.lift{bottom:196px}
.desk.full ~ .sa-watch.lift{bottom:154px}
.sa-join{padding:12px 16px 16px; flex-direction:column; align-items:stretch; gap:8px}
.sa-join b{font-weight:500}
.sa-join small{color:#5C5F50}
.sa-join .jr{display:flex; gap:8px}
.inp.g{border-color:#77786A; text-transform:uppercase; letter-spacing:.14em; font-weight:500; text-align:center}
.inp.g:focus{outline-color:#4B661F}
.pill.g{background:#4B661F; color:#fff}
.pill.g:hover{background:#3F5719}
.err{color:#B3261E; font-size:.85em}
.paused{position:absolute; inset:0; z-index:60; display:grid; place-items:center; padding:18px; background:rgba(120,124,110,.55); backdrop-filter:blur(1.5px)}
.pcard{width:min(360px,100%); background:#fff; border-radius:22px; padding:26px 24px 28px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; box-shadow:0 18px 44px -12px rgba(0,0,0,.4); color:#1F1F1F}
.pcard svg.ill{width:190px; height:110px}
.pcard .clockpill{display:inline-flex; align-items:center; gap:8px; border:1px solid #DADCE0; border-radius:999px; padding:5px 14px; font-size:.9em; color:#1F1F1F}
.pcard .clockpill svg{width:15px; height:15px; color:#1B3A8F}
.pcard h2{margin:6px 0 0; font-size:1.18em; font-weight:500}
.pcard p{margin:0; color:#5E6368; font-size:.9em; line-height:1.5; max-width:30ch}

/* captions */
.cap{position:absolute; left:50%; bottom:58px; transform:translateX(-50%); z-index:75; width:min(760px, calc(100% - 28px)); border-radius:12px; padding:8px 14px 12px; background:rgba(18,18,20,.88); color:#fff}
.desk.full ~ .cap{bottom:16px}
.cap.top{top:12px; bottom:auto}
.cap.light{background:rgba(255,255,255,.96); color:#111; box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
.cap-bar{display:flex; align-items:center; gap:4px; font-size:.78em; opacity:.9; margin-bottom:2px}
.cap-bar svg{width:14px; height:14px}
.cap-bar .ib{width:26px; height:26px; color:inherit}
.cap-bar .ib svg{width:15px; height:15px}
.cap-bar .ib:hover{background:rgba(127,127,127,.25)}
.cap-bar select{font:inherit; font-size:1em; background:transparent; color:inherit; border:1px solid rgba(127,127,127,.5); border-radius:6px; padding:1px 4px}
.cap-bar select option{color:#111}
.cap-t{font-size:1.12em; line-height:1.5; min-height:1.5em}
.cap.s1 .cap-t{font-size:1.35em}
.cap.s2 .cap-t{font-size:1.6em}
.cap-t .old{opacity:.55}
.cap-note{font-size:.72em; opacity:.7}
.menu .fav{width:20px; height:20px; border-radius:5px; font-size:.68em}
.menu > button .fav svg{width:13px; height:13px; color:#fff}
.sa-li .nv{display:grid; place-items:center; color:#45483C}
.sa-li .nv svg{width:17px; height:17px}
.chk .fav{width:24px; height:24px}

 },
 meCap(v){ up(s=>{ s.me.cap=v; }); },
 meLang(v){ up(s=>{ s.me.lang=v; }); },
 meSize(){ up(s=>{ s.me.size=(s.me.size+1)%3; }); },
 meTop(){ up(s=>{ s.me.top=!s.me.top; }); },
 meLight(){ up(s=>{ s.me.light=!s.me.light; }); },
 meWs(k,v){ up(s=>{ s.me.ws[k]=v; }); },
 meQuiz(q,v){ up(s=>{ s.me.quiz[q]=v; }); },
};

setInterval(()=>{

  if(s.lines.length) s.lines=s.lines.filter(l=>now-l.at<15000);

 });

function Fit({children}){
 const outer=useRef(null); const [box,setBox]=useState({w:0,h:0});
 useLayoutEffect(()=>{
  const el=outer.current; if(!el) return;
  const measure=()=>{ const W=el.clientWidth,H=el.clientHeight; let w=W,h=W/1.6; if(h>H){ h=H; w=H*1.6; } setBox({w:Math.max(0,Math.floor(w)),h:Math.max(0,Math.floor(h))}); };
  measure(); const ro=new ResizeObserver(measure); ro.observe(el); return ()=>ro.disconnect();
 },[]);
 return html`<div ref=${outer} style="position:absolute;inset:46px 14px 14px;display:grid;place-items:center">${box.w>0&&html`<div class="mbox" style=${{width:box.w+'px',height:box.h+'px'}}><div class="minner" style=${{transform:`scale(${box.w/1024})`}}>${children}</div></div>`}</div>`;
}

function Landing(){
 const E=[
  ['teacher','교사로 입장','세션을 시작하고 학생·리소스 추가, 탐색 설정, 학생 뷰(탐색·집중·잠금), 학생 화면 보기, 자막을 직접 조작해요. 가상 학생들이 함께 반응해요.',''],
  ['student','학생으로 입장','공유된 탭을 열고 집중·잠금 상태, 화면 보기 알림, 실시간 자막을 학생 자리에서 겪어 봐요. 선생님 동작은 옆의 리모컨으로 실행해요.',''],
  ['split','분할 화면 체험','왼쪽은 교사, 오른쪽은 학생 크롬북이에요. 왼쪽에서 누른 결과가 오른쪽 화면에 바로 나타나요.','연수 시연에 추천'],
 ];
 return html`<main class="lp">
  <header><span class="lp-eyebrow"><i></i>크롬북 · 수업 도구(Class tools) 모의 체험</span>
   <h1>수업 도구 <em>체험실</em></h1>
   <p class="lp-lead">선생님 크롬북에서 누른 버튼이 학생 크롬북에 어떻게 나타나는지, 로그인 없이 직접 눌러 보며 익혀요.</p></header>
  <section class="entries" aria-label="체험 입장">${E.map(([k,t,d,tag])=>html`<button class="entry" onClick=${()=>A.enter(k)}>
   <span class="ill"><${Ill} kind=${k}/></span>${tag&&html`<span class="tag">${tag}</span>`}
   <h2>${t}</h2><p>${d}</p><span class="go">${t}<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>`)}</section>
  <section class="feat"><h3>체험할 수 있는 기능</h3>
   <div class="feat-wrap"><table><thead><tr><th scope="col">기능</th><th scope="col">교사 크롬북에서</th><th scope="col">학생 크롬북에서</th></tr></thead>
   <tbody>${FEATS.map(([a,b,c])=>html`<tr><th scope="row">${a}</th><td>${b}</td><td>${c}</td></tr>`)}</tbody></table></div></section>
  <p class="lp-note">연수·안내용 모의 체험 화면으로, Google이 만든 공식 도구가 아니에요. 실제 수업 도구 화면을 참고해 만들었지만 버전에 따라 구성과 문구가 다를 수 있어요. 실제 수업 도구는 학교에서 관리하는 크롬북(ChromeOS 137 이상)에서 라이선스와 관리자 설정(교사·학생 모드)이 갖춰져야 쓸 수 있어요. 학생 이름과 수업 자료는 모두 예시예요.</p>
 </main>`;
}
function Bar(){
 const modes=[['teacher','교사','teacher'],['student','학생','person'],['split','분할 화면','split']];
 return html`<header class="bar">
  <button class="brand" onClick=${()=>A.enter('landing')} aria-label="체험 첫 화면으로"><${Ic} n="app"/>수업 도구 체험실</button>
  <nav class="seg" aria-label="체험 모드">${modes.map(([k,l,i])=>html`<button aria-pressed=${S.mode===k} onClick=${()=>A.enter(k)}><${Ic} n=${i}/>${l}</button>`)}</nav>
  <div class="bar-r"><span class="sim-tag">모의 체험 · 예시 데이터</span><button class="ghost" onClick=${A.reset}><${Ic} n="reset"/>처음부터 다시</button></div>
 </header>`;
}
function remoteStart(view){
 const ids=CLASSES[0].ids.filter(id=>id!=='me'||S.remoteRoster);
 up(s=>{ s.roster=ids.slice(); s.prefs.view=view; if(!s.res.length) s.res.push({...CAT.assignment[0],id:uid(),restrict:'site',ext:false}); });
 A.start();
}
function Remote(){
 const sess=S.sess, all=[...CAT.assignment,...CAT.tab], next=all.find(x=>!S.res.some(r=>r.key===x.key));
 return html`<aside class="remote" aria-label="가상 선생님 리모컨">
  <div class="r-head"><span class="r-av">서</span><div><b>가상 선생님</b><small>누르면 선생님이 한 동작이 학생 크롬북에 전달돼요</small></div></div>
  ${!sess?html`
   <label class="r-check"><input type="checkbox" checked=${S.remoteRoster} onChange=${e=>up(s=>{ s.remoteRoster=e.target.checked; })}/><span>김하늘을 학생 명단에 넣고 시작<br/><small style="color:var(--ink-2)">끄면 참여 코드로 직접 들어가 봐요</small></span></label>
   <div class="r-group"><span>세션 시작</span><div class="r-btns" style="flex-direction:column">
    <button class="rbtn primary" onClick=${()=>remoteStart('explore')}><${Ic} n="playcircle"/>세션 시작 (탐색)</button>
    <button class="rbtn" style="justify-content:center" onClick=${()=>remoteStart('focus')}><${Ic} n="lock"/>집중 모드로 시작</button></div></div>`
  :html`
   <div class="r-info"><span>참여 코드 <b>${sess.code}</b></span><span>${minsLeft()}분 남음 · ${S.joined.me?'김하늘 참여 중':'김하늘 아직 참여 전'}</span></div>
   <div class="r-group"><span>학생 뷰</span><div class="r-btns">
    ${VIEWS.map(([v,l])=>html`<button class="rbtn" aria-pressed=${sess.view===v} onClick=${()=>A.setView(v)}>${l}</button>`)}</div>
    <small style="color:var(--ink-2);font-size:12.5px">${viewDesc(sess.view)}</small></div>
   <div class="r-group"><span>리소스 공유</span><div class="r-btns"><button class="rbtn" disabled=${!next} onClick=${()=>next&&A.addRes([next])}><${Ic} n="send"/>${next?`‘${next.title}’ 공유`:'준비한 리소스를 모두 공유했어요'}</button></div></div>
   <div class="r-group"><span>학생 화면 보기</span><div class="r-btns">${S.viewing?html`<button class="rbtn" aria-pressed="true" onClick=${A.unwatch}><${Ic} n="x"/>화면 보기 닫기</button>`:html`<button class="rbtn" disabled=${!S.joined.me} onClick=${()=>A.watch('me')}><${Ic} n="eye"/>김하늘 화면 보기</button>`}</div></div>
   <div class="r-group"><span>자막 및 번역</span><div class="r-btns">
    <button class="rbtn" aria-pressed=${S.cap.allow} onClick=${()=>A.cap('allow',!S.cap.allow)}><${Ic} n="subtitles"/>자막 허용</button>
    <button class="rbtn" aria-pressed=${S.cap.tr} disabled=${!S.cap.allow} onClick=${()=>A.cap('tr',!S.cap.tr)}><${Ic} n="translate"/>번역 허용</button>
    <button class="rbtn" onClick=${()=>{ A.say(SAY[S.sayIdx%SAY.length]); up(s=>{ s.sayIdx++; }); }}><${Ic} n="mic"/>말하기</button></div>
    ${!S.cap.allow&&html`<small style="color:var(--ink-2);font-size:12.5px">학생 화면에 자막이 보이려면 ‘자막 허용’을 켜 주세요</small>`}</div>
   <div class="r-btns"><button class="rbtn" onClick=${()=>A.addTime(5)}><${Ic} n="timer"/>5분 추가</button><button class="rbtn warn" onClick=${()=>A.end(false)}><${Ic} n="x"/>세션 종료</button></div>`}
 </aside>`;
}
function Stage(){
 const m=S.mode;
 const lab=(dot,b,sub)=>html`<div class="devlabel"><span class=${'dot'+dot}></span><b>${b}</b><span>${sub}</span></div>`;
 if(m==='teacher') return html`<main class="stage teacher"><div class="devcol">${lab('','교사 크롬북',TEACHER+' 선생님')}<div class="dev"><${TeacherScreen}/></div></div></main>`;
 if(m==='student') return html`<main class="stage student"><div class="devcol">${lab(' s','학생 크롬북',full('me')+' · 6학년 3반')}<div class="dev"><${StudentScreen}/></div></div><${Remote}/></main>`;
 return html`<main class="stage split"><div class="devcol">${lab('','교사',TEACHER+' 선생님 크롬북')}<div class="dev"><${TeacherScreen}/></div></div><div class="devcol">${lab(' s','학생',full('me')+' 크롬북')}<div class="dev"><${StudentScreen}/></div></div></main>`;
}
function App(){
 const [,force]=useReducer(x=>x+1,0);
 useEffect(()=>{ subs.add(force); return ()=>subs.delete(force); },[]);
 return S.mode==='landing'?html`<${Landing}/>`:html`<${Bar}/><${Stage}/>`;
}
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape'||S.mode==='landing') return;
 if(S.t.menu) A.menu(null); else if(S.t.dlg) A.dlg(null); else if(S.viewing) A.unwatch();
});
const root=document.getElementById('root');
root.innerHTML='';
render(html`<${App}/>`,root);
})();
</script>
</body>
</html>
